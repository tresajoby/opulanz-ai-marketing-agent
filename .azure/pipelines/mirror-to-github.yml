trigger:
  branches:
    include:
      - main
      - dev

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true
    fetchDepth: 0

  - script: |
      git config user.email "azuredevops@opulanz.com"
      git config user.name "Azure DevOps Mirror"
      git remote add github https://$(GITHUB_TOKEN)@github.com/tresajoby/opulanz-ai-marketing-agent.git
      git push github HEAD:refs/heads/$(Build.SourceBranchName)
    displayName: "Mirror branch to GitHub"
